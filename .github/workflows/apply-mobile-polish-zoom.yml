name: Apply mobile polish and zoom lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-polish-zoom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 tools/patch_mobile_polish_zoom.py

      - name: Verify update
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
          grep -q 'maximum-scale=1, user-scalable=no' index.html
          grep -q './app.css?v=20260828c' index.html
          grep -q './app.js?v=20260828c' index.html
          grep -q 'kunci zoom PWA/mobile' app.js
          grep -q 'Mobile polish + zoom lock v3' app.css
          grep -q 'mobile-polish-zoom-v3-20260828' sw.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-polish-zoom.yml tools/patch_mobile_polish_zoom.py
          git add index.html app.js app.css sw.js
          git commit -m "Polish mobile Quran view and lock zoom"
          git push
