name: Deploy Hafiz Cilik to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app from ZIP
        run: |
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q hafiz-cilik.zip -d extracted
          cp -a extracted/hafiz-cilik/. _site/

      - name: Install mobile audio fix
        run: |
          cp audio-fix.js _site/audio-fix.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text()
          s = s.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n<script src="audio-fix.js?v=3"></script>')
          p.write_text(s)

          sw = Path('_site/sw.js')
          s = sw.read_text()
          s = s.replace("const VERSION = 'v1';", "const VERSION = 'v3';")
          s = s.replace("'./app.js',", "'./app.js',\n  './audio-fix.js?v=3',")
          sw.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
