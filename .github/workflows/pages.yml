name: Deploy Hafiz Cilik to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app from ZIP
        run: |
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q hafiz-cilik.zip -d extracted
          cp -a extracted/hafiz-cilik/. _site/

      - name: Patch audio directly in app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('_site/app.js')
          s = p.read_text()

          old = "  audio.crossOrigin = 'anonymous';\n"
          if old not in s:
              raise SystemExit('Expected crossOrigin line not found')
          s = s.replace(old, '', 1)

          old = "  a.src = audioUrl(state.reciter, state.verses[idx].global);\n"
          new = "  a.src = `https://the-quran-project.github.io/Quran-Audio/Data/1/${state.surah.id}_${state.verses[idx].no}.mp3`;\n"
          if old not in s:
              raise SystemExit('Expected playback URL line not found')
          s = s.replace(old, new, 1)

          old = "  const url = audioUrl(state.reciter, v.global);\n"
          new = "  const url = `https://the-quran-project.github.io/Quran-Audio/Data/1/${state.surah.id}_${v.no}.mp3`;\n"
          if old not in s:
              raise SystemExit('Expected warm URL line not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          # Force installed browsers/PWAs to discard the old shell cache.
          sw = Path('_site/sw.js')
          sws = sw.read_text()
          sws = sws.replace("const VERSION = 'v1';", "const VERSION = 'v4';")
          sw.write_text(sws)
          PY

          # Verify the actual deploy payload, not merely the workflow source.
          grep -F "the-quran-project.github.io/Quran-Audio/Data/1/" _site/app.js
          if grep -Fq "audio.crossOrigin = 'anonymous'" _site/app.js; then
            echo 'Old CORS setting is still present' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
