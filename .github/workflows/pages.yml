name: Flatten Hafizku source once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  flatten:
    if: ${{ !contains(github.event.head_commit.message, '[flattened-source]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reproduce current v9.3 site exactly
        run: |
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q hafiz-cilik.zip -d extracted
          cp -a extracted/hafiz-cilik/. _site/
          python3 -m pip install --disable-pip-version-check pillow
          python3 customize_hafizku.py _site
          python3 polish_child_ui_v2.py _site
          python3 refine_hafizku_v8.py _site
          python3 hafizku_palette_v9.py _site
          python3 force_hafizku_v9_live.py _site
          python3 generate_hafizku_icons.py _site
          python3 hafizku_v9_2_cleanup.py _site
          python3 restore_reciters_v9_3.py _site
          node --check _site/app.js

      - name: Promote generated site to repository root
        run: |
          cp _site/index.html ./index.html
          cp _site/app.css ./app.css
          cp _site/app.js ./app.js
          cp _site/data.js ./data.js
          cp _site/sw.js ./sw.js
          cp _site/manifest.webmanifest ./manifest.webmanifest
          rm -rf ./icons
          cp -a _site/icons ./icons
          if [ -f _site/README.md ]; then cp _site/README.md ./README.md; fi

          rm -f hafiz-cilik.zip \
            customize_hafizku.py polish_child_ui_v2.py refine_hafizku_v8.py \
            hafizku_palette_v9.py force_hafizku_v9_live.py generate_hafizku_icons.py \
            hafizku_v9_2_cleanup.py restore_reciters_v9_3.py polish_child_ui.py
          rm -rf _site extracted

      - name: Install permanent direct-source Pages workflow
        run: |
          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy Hafizku to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Verify source
                  run: |
                    node --check app.js
                    test -f index.html
                    test -f app.css
                    test -f data.js
                    test -f sw.js
                    test -f manifest.webmanifest
                - name: Configure Pages
                  uses: actions/configure-pages@v5
                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: .
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              needs: build
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Commit flattened source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Flatten generated v9.3 into source [flattened-source]"
          git push origin HEAD:main
