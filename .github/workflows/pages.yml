name: Deploy Hafizku to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app from ZIP
        run: |
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q hafiz-cilik.zip -d extracted
          cp -a extracted/hafiz-cilik/. _site/

      - name: Prepare icon tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Apply Hafizku features
        run: |
          python3 customize_hafizku.py _site
          python3 polish_child_ui_v2.py _site
          python3 refine_hafizku_v8.py _site
          python3 generate_hafizku_icons.py _site

      - name: Verify build
        run: |
          grep -F "Hafizku" _site/index.html
          grep -F "Target Hafalan" _site/app.js
          grep -F "markers:" _site/app.js
          grep -F "data-mark" _site/app.js
          grep -F "apple-touch-icon.png" _site/index.html
          grep -F "Hafizku v8" _site/app.css
          grep -F "const VERSION = 'v8'" _site/sw.js
          node --check _site/app.js
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path('_site/icons')
          expected = {
              'icon-192.png': (192, 192),
              'icon-512.png': (512, 512),
              'icon-maskable-512.png': (512, 512),
              'apple-touch-icon.png': (180, 180),
          }
          for name, size in expected.items():
              img = Image.open(root / name)
              assert img.size == size, (name, img.size, size)
          print('PWA icons verified')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
