name: Apply final Hafizku source once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect complete staged source
        id: staged
        run: |
          count=$(find . -maxdepth 1 -type f -name 'final-v2.part-*' | wc -l)
          if [ "$count" -eq 14 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reassemble and apply staged source
        if: steps.staged.outputs.ready == 'true'
        run: |
          rm -f final-v2.tar.gz
          cat final-v2.part-* | base64 -d > final-v2.tar.gz
          echo "f85e7bc833cd0ba7d315726ee37dacda130f33f7daf40c26f42c7545296ff036  final-v2.tar.gz" | sha256sum -c -
          tar -xzf final-v2.tar.gz
          rm -f final-v2.tar.gz final-v2.part-* final-source.tar.gz final-source.part-* audio-fix.js
          node --check app.js
          node --check data.js
          node --check sw.js

      - name: Commit final source
        if: steps.staged.outputs.ready == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows/pages.yml'
          git commit -m "Complete Hafizku source refactor [source-applied]"
          git push origin HEAD:main
