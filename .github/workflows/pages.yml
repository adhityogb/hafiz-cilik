name: Apply audio reliability refactor once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'Refactor mobile audio reliability [audio-v10.1]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded refactor
        env:
          AUDIO_REFACTOR_GZ_B64: 
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          exec(gzip.decompress(base64.b64decode(os.environ['AUDIO_REFACTOR_GZ_B64'])))
          PY

      - name: Verify source
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
          grep -F "const APP_VERSION = '10.1.0';" data.js
          grep -F "const AUDIO_CACHE_NAME = 'hafiz-audio-v2';" data.js
          grep -F "const AUDIO_CACHE = AUDIO_CACHE_NAME;" app.js
          grep -F "const AUDIO = AUDIO_CACHE_NAME;" sw.js
          grep -F "status:206" sw.js
          grep -F "response.status === 200" app.js
          grep -F "hit.type === 'opaque' || hit.status !== 200" sw.js
          grep -F "await migrateLegacyAudioCaches();" app.js
          ! grep -F "const SILENCE" app.js
          ! grep -F "function warm(" app.js
          ! grep -F "mode: 'no-cors'" app.js
          ! grep -F "audio.removeAttribute('src')" app.js
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const data=fs.readFileSync('data.js','utf8');
          const rows=[...data.matchAll(/\{\s*id:\s*(\d+),.*?start:\s*(\d+),\s*n:\s*(\d+)/g)].map(m=>`${m[1]}:${m[2]}:${m[3]}`).join('\n');
          const hash=crypto.createHash('sha256').update(rows).digest('hex');
          if(hash!=='4daa2d4a5f3861cd2f56195da3302c7ca8bf252b1c7c804c82cfb0ea656ba752') throw new Error(`data id/start/n berubah: ${hash}`);
          NODE

      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js data.js sw.js README.md
          git commit -m "Refactor mobile audio reliability [audio-v10.1]"
          git push origin HEAD:main
