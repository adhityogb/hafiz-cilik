name: Apply ayah color polish once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visual polish to source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('app.css')
          css = css_path.read_text()
          marker = '/* Hafizku 10.0.1 — colorful ayah buttons + detail spacing */'
          if marker not in css:
              css += r'''

/* Hafizku 10.0.1 — colorful ayah buttons + detail spacing */
/* Beri napas antara kartu header dan action bar saat surah dibuka. */
#viewSurah > .bar {
  margin-top: 20px;
  margin-bottom: 18px;
}

/* Warna ayat bergilir. Ini hanya untuk identitas ayat; warna kartu surah tetap
   semantik berdasarkan field sky dan tidak bergantung pada posisi. */
.ayah-card:nth-of-type(6n+1), .ayah-wrap:nth-of-type(6n+1) { --ayah-bg:#BAE6FD; --ayah-edge:#38BDF8; --ayah-ink:#0C4A6E; }
.ayah-card:nth-of-type(6n+2), .ayah-wrap:nth-of-type(6n+2) { --ayah-bg:#FBCFE8; --ayah-edge:#F472B6; --ayah-ink:#831843; }
.ayah-card:nth-of-type(6n+3), .ayah-wrap:nth-of-type(6n+3) { --ayah-bg:#BBF7D0; --ayah-edge:#4ADE80; --ayah-ink:#14532D; }
.ayah-card:nth-of-type(6n+4), .ayah-wrap:nth-of-type(6n+4) { --ayah-bg:#E9D5FF; --ayah-edge:#C084FC; --ayah-ink:#581C87; }
.ayah-card:nth-of-type(6n+5), .ayah-wrap:nth-of-type(6n+5) { --ayah-bg:#FEF08A; --ayah-edge:#EAB308; --ayah-ink:#713F12; }
.ayah-card:nth-of-type(6n+6), .ayah-wrap:nth-of-type(6n+6) { --ayah-bg:#FED7AA; --ayah-edge:#FB923C; --ayah-ink:#7C2D12; }

/* Mode fokus: seluruh tombol ayat mendapat warna yang jelas. */
.ayat--numbers .ayah-number {
  background: var(--ayah-bg);
  border-color: var(--ayah-edge);
  color: var(--ayah-ink);
  box-shadow: 0 7px 0 color-mix(in srgb, var(--ayah-edge) 32%, transparent),
              0 12px 20px rgba(22,50,79,.08);
}
.ayat--numbers .ayah-number .ayah__no {
  background: rgba(255,255,255,.72);
  border-color: var(--ayah-edge);
  color: var(--ayah-ink);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.72);
}
.ayat--numbers .ayah-number__label,
.ayat--numbers .ayah-number__label small {
  color: var(--ayah-ink);
}
.ayat--numbers .ayah-number__play {
  background: rgba(255,255,255,.66);
  color: var(--ayah-ink);
}

/* Mode teks: kartu tetap putih agar Arab/latin/arti nyaman dibaca, tetapi
   nomor dan tombol play memakai warna ayat yang sama. */
.ayat--full .ayah__no {
  background: var(--ayah-bg);
  border-color: var(--ayah-edge);
  color: var(--ayah-ink);
}
.ayat--full .ayah__cue {
  background: var(--ayah-bg);
  color: var(--ayah-ink);
  box-shadow: inset 0 0 0 2px var(--ayah-edge);
}

@media (max-width: 430px) {
  #viewSurah > .bar { margin-top: 18px; margin-bottom: 17px; }
}
'''
          css_path.write_text(css)

          data_path = Path('data.js')
          data = data_path.read_text()
          if "const APP_VERSION = '10.0.0';" in data:
              data = data.replace("const APP_VERSION = '10.0.0';", "const APP_VERSION = '10.0.1';", 1)
          elif "const APP_VERSION = '10.0.1';" not in data:
              raise SystemExit('APP_VERSION yang diharapkan tidak ditemukan')
          data_path.write_text(data)
          PY

      - name: Verify source
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
          grep -F "Hafizku 10.0.1" app.css
          grep -F "const APP_VERSION = '10.0.1';" data.js
          grep -F "#viewSurah > .bar" app.css
          grep -F ".ayah-card:nth-of-type(6n+6)" app.css
          ! grep -Eq '\.card:nth-(child|of-type)' app.css

      - name: Commit polished source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.css data.js
          git commit -m "Polish colorful ayah buttons and detail spacing"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: polish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
