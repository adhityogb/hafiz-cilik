name: Deploy Hafizku to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app from ZIP
        run: |
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q hafiz-cilik.zip -d extracted
          cp -a extracted/hafiz-cilik/. _site/

      - name: Apply Hafizku features
        run: |
          python3 customize_hafizku.py _site
          python3 polish_child_ui.py _site

      - name: Verify build
        run: |
          grep -F "Hafizku" _site/index.html
          grep -F "Target Hafalan" _site/app.js
          grep -F "stableAudioUrl" _site/app.js
          grep -F "user-scalable=no" _site/index.html
          grep -F "s-river" _site/index.html
          grep -F "Hafizku v7" _site/app.css
          node --check _site/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
