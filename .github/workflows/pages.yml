name: Apply final Hafizku source once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect staged source
        id: staged
        run: |
          if [ -f final-source.tar.gz ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply staged source
        if: steps.staged.outputs.ready == 'true'
        run: |
          tar -xzf final-source.tar.gz
          rm -f final-source.tar.gz audio-fix.js
          node --check app.js
          node --check data.js
          node --check sw.js

      - name: Commit final source
        if: steps.staged.outputs.ready == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows/pages.yml'
          git commit -m "Complete Hafizku source refactor [source-applied]"
          git push origin HEAD:main
