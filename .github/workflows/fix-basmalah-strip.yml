name: Fix Uthmani Basmalah stripping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-basmalah-strip.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix and test Basmalah stripping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('app.js')
          app = path.read_text(encoding='utf-8')
          start = app.index('function stripBasmalahArabic(text) {')
          end = app.index('\nfunction toast(msg) {', start)
          replacement = dedent(r'''
          function stripBasmalahArabic(text) {
            const source = String(text || '').trim();
            const target = 'بسماللهالرحمنالرحيم';
            let i = 0;
            let t = 0;
            const isIgnorable = ch => /\s/u.test(ch) || ARABIC_MARK_RE.test(ch) || ch === 'ـ';
            const normalizedLetter = ch => 'ٱأإآ'.includes(ch) ? 'ا' : ch;

            while (t < target.length) {
              while (i < source.length && isIgnorable(source[i])) i++;
              if (i >= source.length || normalizedLetter(source[i]) !== target[t]) return source;
              i++;
              t++;
            }
            while (i < source.length && isIgnorable(source[i])) i++;
            return source.slice(i).trim();
          }
          ''')
          app = app[:start] + replacement + app[end:]
          path.write_text(app, encoding='utf-8')
          PY

          node --check app.js
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('app.js', 'utf8');
          const start = source.indexOf('const BASMALAH_AR =');
          const end = source.indexOf('function toast(msg) {', start);
          const snippet = source.slice(start, end);
          const sample = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ قُلْ هُوَ ٱللَّهُ أَحَدٌ';
          const expected = 'قُلْ هُوَ ٱللَّهُ أَحَدٌ';
          eval(snippet + `\nif (stripBasmalahArabic(${JSON.stringify(sample)}) !== ${JSON.stringify(expected)}) throw new Error('Basmalah strip failed');`);
          console.log('Uthmani Basmalah stripping OK');
          NODE

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-basmalah-strip.yml
          git add app.js
          git commit -m "Fix Basmalah stripping for Uthmani diacritics"
          git push
