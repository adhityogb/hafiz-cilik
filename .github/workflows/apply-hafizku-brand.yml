name: Apply HafizKu branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hafizku-brand.yml'

permissions:
  contents: write

jobs:
  apply-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply logo and branding consistently
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # HTML branding + real app logo in header.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Hafizku', 'HafizKu')
          s = s.replace('<meta name="theme-color" content="#38BDF8">', '<meta name="theme-color" content="#0F9D8B">')
          s = s.replace('<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">', '<link rel="icon" href="./icons/icon-192.png" type="image/png">')
          old_mark = '<div class="brand__mark" aria-hidden="true"><svg class="ico"><use href="#i-book-open"></use></svg></div>'
          new_mark = '<div class="brand__mark" aria-hidden="true"><img src="./icons/icon-192.png" alt=""></div>'
          if old_mark not in s:
              raise SystemExit('Header brand mark pattern not found')
          s = s.replace(old_mark, new_mark)
          p.write_text(s, encoding='utf-8')

          # Header styling now follows the teal/gold HafizKu identity.
          p = Path('app.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* Hafizku — antarmuka PWA hafalan Juz 30 */', '/* HafizKu — antarmuka PWA hafalan Juz 30 */')
          old = '.top{background:#fff;border:4px solid #38BDF8;border-radius:var(--r-lg);box-shadow:var(--lift);padding:13px 15px;display:flex;align-items:center;gap:13px}.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}.brand__mark{width:52px;height:52px;flex:none;border-radius:17px;background:linear-gradient(160deg,#FEF08A,#FDE047);border:3px solid #F59E0B;display:grid;place-items:center;box-shadow:var(--gloss);transform:rotate(-6deg)}.brand__mark .ico{width:29px;height:29px;color:#713F12}.brand__name{font-size:1.45rem;color:#0284C7}.brand__sub{font-size:.74rem;font-weight:800;color:#38A8DE;margin:2px 0 0}'
          new = '.top{background:#fff;border:4px solid #14B8A6;border-radius:var(--r-lg);box-shadow:var(--lift);padding:13px 15px;display:flex;align-items:center;gap:13px}.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}.brand__mark{width:56px;height:56px;flex:none;border-radius:17px;background:#fff;border:2px solid #CCFBF1;display:grid;place-items:center;box-shadow:0 3px 10px rgba(15,118,110,.14);overflow:hidden}.brand__mark img{width:100%;height:100%;object-fit:contain;display:block}.brand__name{font-size:1.45rem;color:#0F766E}.brand__sub{font-size:.74rem;font-weight:800;color:#0F9D8B;margin:2px 0 0}'
          if old not in s:
              raise SystemExit('Header CSS pattern not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # PWA install metadata for Android/Chrome and other supporting platforms.
          p = Path('manifest.webmanifest')
          m = json.loads(p.read_text(encoding='utf-8'))
          m['name'] = 'HafizKu — Teman Hafalan Juz 30'
          m['short_name'] = 'HafizKu'
          m['description'] = 'HafizKu membantu anak mendengar, mengulang, dan menghafal Juz 30 dengan fokus.'
          m['background_color'] = '#FFFFFF'
          m['theme_color'] = '#0F9D8B'
          m['icons'] = [
            {'src':'./icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'./icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
            {'src':'./icons/icon-maskable-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
          ]
          p.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Force installed PWAs to refresh the shell/icon references.
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/* Hafizku — service worker: shell, teks, font, dan audio offline. */', '/* HafizKu — service worker: shell, teks, font, dan audio offline. */')
          s = s.replace("const VERSION = APP_VERSION + '-install-banner-20260817';", "const VERSION = APP_VERSION + '-hafizku-brand-20260827';")
          p.write_text(s, encoding='utf-8')

          # One-shot workflow: remove itself after applying the patch.
          Path('.github/workflows/apply-hafizku-brand.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply HafizKu branding across PWA"
          git push
