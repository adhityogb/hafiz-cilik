name: Apply mobile Basmalah v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-basmalah-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 tools/patch_mobile_basmalah_v2.py

      - name: Verify JavaScript and assets
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
          grep -q './app.css?v=20260828b' index.html
          grep -q './app.js?v=20260828b' index.html
          grep -q 'basmalah-arabic-v2-20260828' sw.js
          grep -q 'Mobile Arabic readability + fixed Basmalah v2' app.css

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-basmalah-v2.yml tools/patch_mobile_basmalah_v2.py
          git add index.html app.js app.css sw.js
          git commit -m "Fix stale PWA Basmalah and mobile Arabic layout"
          git push
